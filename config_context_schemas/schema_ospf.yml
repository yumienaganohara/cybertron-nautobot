---
_metadata:
  name: "OSPF Configuration Schema"
  description: "OSPF configuration for IPv4 (OSPFv2) and IPv6 (OSPFv3)"
data_schema:
  title: "OSPF Settings"
  type: object
  properties:
    ospf:
      type: object
      properties:
        router_id:
          type: string
          format: ipv4
          description: "Router ID for both OSPFv2 and OSPFv3"
        ipv4:
          type: object
          properties:
            process_id:
              type: integer
              description: "OSPFv2 process ID"
            redistribute:
              type: array
              description: "Protocols to redistribute OSPFv2"
              items:
                type: object
                properties:
                  protocol:
                    type: string
                    enum: [ "connected", "bgp", "static", "eigrp" ]
                  metric:
                    type: integer
                  route_map:
                    type: string
                required:
                - protocol
            passive_interface:
              type: array
              description: "Interfaces marked as passive"
              items:
                type: string
            log_adjacency_changes:
              type: boolean
              default: true
            bfd:
              type: boolean
              default: false
            timers:
              type: object
              properties:
                throttle_spf:
                  type: string
                  pattern: "^[0-9]+ [0-9]+ [0-9]+$"
                  description: "start hold max-time"
          required:
          - process_id

        ipv6:
          type: object
          properties:
            process_id:
              type: integer
              description: "OSPFv3 process ID"
            redistribute:
              type: array
              description: "Protocols to redistribute OSPFv3"
              items:
                type: object
                properties:
                  protocol:
                    type: string
                    enum: [ "connected", "bgp", "static" ]
                  metric:
                    type: integer
                  route_map:
                    type: string
                required:
                - protocol
            passive_interface:
              type: array
              description: "Interfaces marked as passive"
              items:
                type: string
            log_adjacency_changes:
              type: boolean
              default: true
            bfd:
              type: boolean
              default: false
          required:
          - process_id

      required:
      - router_id
      - ipv4
      - ipv6
  required:
  - ospf
